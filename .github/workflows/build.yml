---
name: build

'on':
  push:
    branches:
      - master
    tags:
      - '*'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CCACHE_MAXSIZE: 1G
  CCACHE_COMPILERCHECK: content
  CCACHE_BASEDIR: ${{ github.workspace }}

jobs:
  linux-x86_64:
    name: linux-x86_64
    runs-on: ubuntu-22.04
    env:
      CMAKE_OPTS: >-
        -DUSE_WERROR=ON
        -DCMAKE_BUILD_TYPE=RelWithDebInfo
        -DTARGET_UARCH=official
        -DUSE_COMPILE_CACHE=ON
        -DWANT_DEBUG_CPACK=ON
    steps:
      - name: Configure git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ startsWith(github.ref, 'refs/tags/') && '0' || '1' }}
          submodules: recursive
      - name: Set up environment
        run: |
          echo "CMAKE_BUILD_PARALLEL_LEVEL=$(nproc)" | tee -a "$GITHUB_ENV"
          fltk_prefix="$HOME/.local/mxm-fltk"
          lib_path="$fltk_prefix/lib:$fltk_prefix/lib64"
          echo "CMAKE_PREFIX_PATH=$fltk_prefix${CMAKE_PREFIX_PATH:+:$CMAKE_PREFIX_PATH}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$lib_path${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      - name: Configure winehq
        run: |
          sudo dpkg --add-architecture i386
          sudo mkdir -pm755 /etc/apt/keyrings
          wget -O - https://dl.winehq.org/wine-builds/winehq.key | \
          sudo gpg --dearmor -o /etc/apt/keyrings/winehq-archive.key -
          sudo wget -NP /etc/apt/sources.list.d/ \
          https://dl.winehq.org/wine-builds/ubuntu/dists/$(lsb_release -cs)/winehq-$(lsb_release -cs).sources
      - name: Install packages
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            $(xargs < .github/workflows/deps-ubuntu-24.04-gcc.txt)
          sudo apt-get install -y --install-recommends g++-multilib gcc-multilib winehq-devel wine-devel-dev
          sudo apt-get install -y --install-recommends \
            $(xargs < .github/workflows/deps-ubuntu-24.04-fltk.txt)
      - name: Cache FLTK
        id: cache-fltk
        uses: actions/cache@v6
        with:
          key: fltk-${{ runner.os }}-${{ runner.arch }}-27d991f046bdebb12bfd58f7c05a19f135979c29
          path: ~/.local/mxm-fltk
      - name: Clone FLTK
        if: steps.cache-fltk.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: fltk/fltk
          path: fltk
          ref: 27d991f046bdebb12bfd58f7c05a19f135979c29
          fetch-depth: 1
      - name: Build and install FLTK
        if: steps.cache-fltk.outputs.cache-hit != 'true'
        run: |
          cmake -S fltk -B fltk/build \
            -DCMAKE_INSTALL_PREFIX="$HOME/.local/mxm-fltk" \
            -DFLTK_BUILD_SHARED_LIBS=ON \
            -DFLTK_BACKEND_WAYLAND=ON \
            -DFLTK_USE_LIBDECOR_GTK=OFF \
            -DFLTK_BUILD_TEST=OFF \
            -DFLTK_BUILD_GL=OFF
          cmake --build fltk/build
          cmake --install fltk/build
      - name: Cache ccache data
        uses: actions/cache@v6
        with:
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
          path: ~/.cache/ccache
      - name: Configure
        run: |
          ccache --zero-stats
          source /opt/qt5*/bin/qt5*-env.sh || true
          cmake -S . \
                -B build \
                $CMAKE_OPTS
      - name: Build
        run: cmake --build build
      - name: Install test VST3 plugin (Surge XT)
        run: |
          mkdir -p vst3-plugins
          curl -fsSL -o surge-xt.deb \
            https://github.com/surge-synthesizer/releases-xt/releases/download/1.3.4/surge-xt-linux-x64-1.3.4.deb
          dpkg-deb -x surge-xt.deb vst3-plugins
      - name: Run tests
        run: |
          cd build/tests
          ctest --output-on-failure --no-tests=error -j2
        env:
          MXM_VST3_PATH_ONLY: 1
          VST3_PATH: ${{ github.workspace }}/vst3-plugins
      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-diagnostics-${{ github.job }}-${{ runner.arch }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            build/tests/Testing/Temporary/LastTest.log
            build/tests/Testing/Temporary/LastTestsFailed.log
            build/tests/integration/artifacts/**
      - name: Package
        if: startsWith(github.ref, 'refs/tags/')
        run: cmake --build build --target package
      - name: Upload artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: build/mxm-*.AppImage
      - name: Trim ccache and print statistics
        if: always()
        run: |
          ccache --cleanup
          echo "[ccache config]"
          ccache --show-config
          echo "[ccache stats]"
          ccache --show-stats

  linux-arm64:
    name: linux-arm64
    runs-on: ubuntu-24.04-arm
    env:
      CMAKE_OPTS: >-
        -DUSE_WERROR=ON
        -DCMAKE_BUILD_TYPE=RelWithDebInfo
        -DTARGET_UARCH=official
        -DUSE_COMPILE_CACHE=ON
        -DWANT_DEBUG_CPACK=ON
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Configure git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ startsWith(github.ref, 'refs/tags/') && '0' || '1' }}
          submodules: recursive
      - name: Set up environment
        run: |
          echo "CMAKE_BUILD_PARALLEL_LEVEL=$(nproc)" | tee -a "$GITHUB_ENV"
          fltk_prefix="$HOME/.local/mxm-fltk"
          lib_path="$fltk_prefix/lib:$fltk_prefix/lib64"
          echo "CMAKE_PREFIX_PATH=$fltk_prefix${CMAKE_PREFIX_PATH:+:$CMAKE_PREFIX_PATH}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$lib_path${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      - name: Install system packages
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            $(xargs < .github/workflows/deps-ubuntu-24.04-gcc.txt)
          sudo apt-get install -y --install-recommends \
            $(xargs < .github/workflows/deps-ubuntu-24.04-fltk.txt)
      - name: Cache FLTK
        id: cache-fltk
        uses: actions/cache@v6
        with:
          key: fltk-${{ runner.os }}-${{ runner.arch }}-27d991f046bdebb12bfd58f7c05a19f135979c29
          path: ~/.local/mxm-fltk
      - name: Clone FLTK
        if: steps.cache-fltk.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: fltk/fltk
          path: fltk
          ref: 27d991f046bdebb12bfd58f7c05a19f135979c29
          fetch-depth: 1
      - name: Build and install FLTK
        if: steps.cache-fltk.outputs.cache-hit != 'true'
        run: |
          cmake -S fltk -B fltk/build \
            -DCMAKE_INSTALL_PREFIX="$HOME/.local/mxm-fltk" \
            -DFLTK_BUILD_SHARED_LIBS=ON \
            -DFLTK_BACKEND_WAYLAND=ON \
            -DFLTK_USE_LIBDECOR_GTK=OFF \
            -DFLTK_BUILD_TEST=OFF \
            -DFLTK_BUILD_GL=OFF
          cmake --build fltk/build
          cmake --install fltk/build
      - name: Cache ccache data
        uses: actions/cache@v6
        with:
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
          path: ~/.cache/ccache
      - name: Configure
        run: |
          ccache --zero-stats
          cmake -S . \
                -B build \
                $CMAKE_OPTS
      - name: Build
        run: cmake --build build
      - name: Run tests
        run: |
          cd build/tests
          ctest --output-on-failure --no-tests=error -j2
      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-diagnostics-${{ github.job }}-${{ runner.arch }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            build/tests/Testing/Temporary/LastTest.log
            build/tests/Testing/Temporary/LastTestsFailed.log
            build/tests/integration/artifacts/**
      - name: Package
        if: startsWith(github.ref, 'refs/tags/')
        run: cmake --build build --target package
      - name: Upload artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: build/mxm-*.AppImage
      - name: Trim ccache and print statistics
        if: always()
        run: |
          ccache --cleanup
          echo "[ccache config]"
          ccache --show-config
          echo "[ccache stats]"
          ccache --show-stats

  macos:
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
        include:
          - arch: x86_64
            os: macos-15-intel
            xcode: "16.4"
            macosx_deployment_target: 10.15
          - arch: arm64
            os: macos-15
            xcode: "16.4"
            macosx_deployment_target: 11.0
    name: macos-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    env:
      CMAKE_OPTS: >-
        -Werror=dev
        -DUSE_WERROR=OFF
        -DCMAKE_BUILD_TYPE=RelWithDebInfo
        -DTARGET_UARCH=official
        -DWANT_QT6=ON
        -DUSE_COMPILE_CACHE=ON
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ startsWith(github.ref, 'refs/tags/') && '0' || '1' }}
          submodules: recursive
      - name: Set up environment
        run: |
          echo "CMAKE_BUILD_PARALLEL_LEVEL=$(sysctl -n hw.logicalcpu)" | tee -a "$GITHUB_ENV"
      - name: Clean up Homebrew download cache
        run: rm -rf ~/Library/Caches/Homebrew/downloads
      - name: Restore Homebrew download cache
        id: cache-homebrew
        uses: actions/cache/restore@v6
        with:
          key: homebrew-${{ matrix.arch }}-${{ hashFiles('Brewfile') }}
          restore-keys: |
            homebrew-${{ matrix.arch }}-
          path: ~/Library/Caches/Homebrew/downloads
      - name: Cache ccache data
        uses: actions/cache@v6
        with:
          key: ccache-${{ runner.os }}-${{ matrix.arch }}-${{ github.job }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ matrix.arch }}-${{ github.job }}-
          path: ~/Library/Caches/ccache
      - name: Install build dependencies
        run: brew bundle install --verbose
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_UPGRADE: 1
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
      - name: Save Homebrew download cache
        if: steps.cache-homebrew.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          key: homebrew-${{ matrix.arch }}-${{ hashFiles('Brewfile') }}
          path: ~/Library/Caches/Homebrew/downloads
      - name: Install packaging dependencies
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          pipx install dmgbuild
          pipx ensurepath
      - name: Configure
        run: |
          ccache --zero-stats
          mkdir build
          cmake -S . \
                -B build \
                -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
                -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ matrix.macosx_deployment_target }} \
                $CMAKE_OPTS
      - name: Build
        run: cmake --build build
      - name: Run tests
        run: |
          cd build/tests
          ctest --output-on-failure --no-tests=error -j3
      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-diagnostics-${{ github.job }}-${{ runner.arch }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            build/tests/Testing/Temporary/LastTest.log
            build/tests/Testing/Temporary/LastTestsFailed.log
            build/tests/integration/artifacts/**
      - name: Package
        if: startsWith(github.ref, 'refs/tags/')
        run: cmake --build build --target package
      - name: Upload artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: build/mxm-*.dmg
      - name: Trim ccache and print statistics
        if: always()
        run: |
          ccache --cleanup
          echo "[ccache config]"
          ccache --show-config
          echo "[ccache stats]"
          ccache --show-stats --verbose

  mingw:
    name: mingw64
    runs-on: ubuntu-latest
    env:
      CMAKE_OPTS: >-
        -Werror=dev
        -DUSE_WERROR=ON
        -DCMAKE_BUILD_TYPE=RelWithDebInfo
        -DTARGET_UARCH=official
        -DUSE_COMPILE_CACHE=ON
    steps:
      - name: Configure git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ startsWith(github.ref, 'refs/tags/') && '0' || '1' }}
          submodules: recursive
      - name: Set up environment
        run: |
          echo "CMAKE_BUILD_PARALLEL_LEVEL=$(nproc)" | tee -a "$GITHUB_ENV"
      - name: Restore vcpkg dependencies
        id: cache-deps
        uses: actions/cache/restore@v6
        with:
          key: vcpkg-mingw-x86_64-${{ hashFiles('vcpkg.json') }}
          path: build/vcpkg_installed
      - name: Cache ccache data
        uses: actions/cache@v6
        with:
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
          path: ~/.cache/ccache
      - name: Install dependencies
        run: |
          sudo .github/workflows/setup-mingw-packages.sh
          sudo apt-get install -y --no-install-recommends \
            $(xargs < .github/workflows/deps-ubuntu-24.04-mingw.txt)
      - name: Configure
        run: |
          export VCPKG_ROOT=${VCPKG_INSTALLATION_ROOT}
          echo "VCPKG_ROOT=${VCPKG_ROOT}" >> "$GITHUB_ENV"
          ccache --zero-stats
          cmake -S . \
                -B build \
                -DCMAKE_TOOLCHAIN_FILE="./cmake/toolchains/x64-mingw-vcpkg.cmake" \
                -DVCPKG_MANIFEST_INSTALL="${{ env.should_install_manifest }}" \
                $CMAKE_OPTS
        env:
          should_install_manifest:
            ${{ steps.cache-deps.outputs.cache-hit == 'true' && 'NO' || 'YES' }}
      - name: Save vcpkg dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          key: vcpkg-mingw-x86_64-${{ hashFiles('vcpkg.json') }}
          path: build/vcpkg_installed
      - name: Build
        run: cmake --build build
      - name: Package
        if: startsWith(github.ref, 'refs/tags/')
        run: cmake --build build --target package
      - name: Upload artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: build/mxm-*.exe
      - name: Trim ccache and print statistics
        if: always()
        run: |
          ccache --cleanup
          echo "[ccache config]"
          ccache --show-config
          echo "[ccache stats]"
          ccache --show-stats

  msvc:
    name: msvc-x64
    runs-on: windows-2025-vs2026
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ startsWith(github.ref, 'refs/tags/') && '0' || '1' }}
          submodules: recursive
      - name: Restore vcpkg dependencies
        id: cache-deps
        uses: actions/cache/restore@v6
        with:
          key: vcpkg-msvc-x86_64-${{ hashFiles('vcpkg.json') }}
          path: build\vcpkg_installed
      - name: Cache ccache data
        uses: actions/cache@v6
        with:
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
          path: ~\AppData\Local\ccache
      - name: Install build tools
        run: choco install ccache
      - name: Install packaging tools
        if: startsWith(github.ref, 'refs/tags/')
        run: choco install nsis
      - name: Install Qt
        uses: jurplel/install-qt-action@bcb88e3bed2e992f5f9e24c0f9e364a231d278eb
        with:
          version: '6.8.*'
          arch: win64_msvc2022_64
          archives: qtbase qtsvg qttools
          cache: true
      - name: Set up build environment
        uses: TheMrMilchmann/setup-msvc-dev@368ef7d1ee4d1171b31d4a7f67f4d954f903f5a9
        with:
          arch: x64
      - name: Configure
        run: |
          ccache --zero-stats
          mkdir build -Force
          cmake -S . `
            -B build `
            -G Ninja `
            --toolchain C:/vcpkg/scripts/buildsystems/vcpkg.cmake `
            -Werror=dev `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DTARGET_UARCH=official `
            -DWANT_QT6=ON `
            -DUSE_COMPILE_CACHE=ON `
            -DUSE_WERROR=ON `
            -DVCPKG_TARGET_TRIPLET="x64-windows" `
            -DVCPKG_HOST_TRIPLET="x64-windows" `
            -DVCPKG_MANIFEST_INSTALL="${{ env.should_install_manifest }}"
        env:
          should_install_manifest:
            ${{ steps.cache-deps.outputs.cache-hit == 'true' && 'NO' || 'YES' }}
      - name: Save vcpkg dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          key: vcpkg-msvc-x86_64-${{ hashFiles('vcpkg.json') }}
          path: build\vcpkg_installed
      - name: Build
        run: cmake --build build
      - name: Install test VST3 plugin (Surge XT)
        run: |
          New-Item -ItemType Directory -Force vst3-plugins | Out-Null
          curl.exe -fsSL -o surge-xt.zip `
            https://github.com/surge-synthesizer/releases-xt/releases/download/1.3.4/surge-xt-win64-1.3.4-pluginsonly.zip
          tar -xf surge-xt.zip -C vst3-plugins
      - name: Run tests
        run: |
          $env:PATH = "${{ github.workspace }}\build\plugins;$env:PATH"
          cd build/tests
          ctest --output-on-failure --no-tests=error -j2
        env:
          MXM_VST3_PATH_ONLY: 1
          MXM_VST3_TEST_TRACE: ${{ github.workspace }}\vst3-test-trace.log
          VST3_PATH: ${{ github.workspace }}\vst3-plugins
      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-diagnostics-${{ github.job }}-${{ runner.arch }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            build/tests/Testing/Temporary/LastTest.log
            build/tests/Testing/Temporary/LastTestsFailed.log
            build/tests/integration/artifacts/**
            vst3-test-trace.log
      - name: Package
        if: startsWith(github.ref, 'refs/tags/')
        run: cmake --build build --target package
      - name: Upload artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: build\mxm-*.exe
      - name: Trim ccache and print statistics
        if: always()
        run: |
          ccache --cleanup
          echo "[ccache config]"
          ccache --show-config
          echo "[ccache stats]"
          ccache --show-stats --verbose

  msys2:
    name: windows-arm64
    runs-on: windows-11-arm
    defaults:
      run:
        shell: msys2 {0}
    env:
      CMAKE_OPTS: >-
        -DCMAKE_BUILD_TYPE=RelWithDebInfo
        -DTARGET_UARCH=official
        -DWANT_QT6=ON
        -DUSE_COMPILE_CACHE=ON
        -DCPACK_NSIS_EXECUTABLE=/clang64/bin/makensis.exe
      CMAKE_BUILD_PARALLEL_LEVEL: 4
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ startsWith(github.ref, 'refs/tags/') && '0' || '1' }}
          submodules: recursive
      - name: Restore pacman package cache
        id: cache-pacman
        uses: actions/cache/restore@v6
        with:
          key: pacman-windows-arm64-${{ hashFiles('.github/workflows/deps-msys2-clangarm64.txt') }}
          restore-keys: |
            pacman-windows-arm64-
          path: C:\msys64\var\cache\pacman\pkg
      - name: Install msys2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          msystem: CLANGARM64
          update: false
          cache: false
      - name: Restore prepared msys2 environment
        id: cache-msys2-env
        uses: actions/cache/restore@v6
        with:
          key: msys2-env-windows-arm64-v2-${{ hashFiles('.github/workflows/deps-msys2-clangarm64.txt') }}
          path: C:\msys64
      - name: Install build dependencies
        run: |
          if [[ "${{ steps.cache-msys2-env.outputs.cache-hit }}" != "true" \
            || ! -x /clang64/bin/ccache.exe ]]; then
            grep -v '^mingw-w64-clang-x86_64-nsis$' .github/workflows/deps-msys2-clangarm64.txt \
              | pacman --needed --noconfirm -S -
          fi
      - name: Save prepared msys2 environment
        if: steps.cache-msys2-env.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          key: msys2-env-windows-arm64-v2-${{ hashFiles('.github/workflows/deps-msys2-clangarm64.txt') }}
          path: C:\msys64
      - name: Save pacman package cache
        if: steps.cache-pacman.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          key: pacman-windows-arm64-${{ hashFiles('.github/workflows/deps-msys2-clangarm64.txt') }}
          path: C:\msys64\var\cache\pacman\pkg
      - name: Install packaging dependencies
        if: startsWith(github.ref, 'refs/tags/')
        run: pacman --needed --noconfirm -S mingw-w64-clang-x86_64-nsis
      - name: Cache ccache data
        uses: actions/cache@v6
        with:
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
          path: ~\AppData\Local\ccache
      - name: Configure
        run: |
          /clang64/bin/ccache.exe --zero-stats
          cmake -B build $CMAKE_OPTS
      - name: Build
        run: cmake --build build
      - name: Run tests
        run: |
          cd build/tests
          ctest --output-on-failure --no-tests=error -j2
        env:
          MXM_VST3_PATH_ONLY: 1
      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-diagnostics-${{ github.job }}-${{ runner.arch }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            build/tests/Testing/Temporary/LastTest.log
            build/tests/Testing/Temporary/LastTestsFailed.log
            build/tests/integration/artifacts/**
      - name: Package
        if: startsWith(github.ref, 'refs/tags/')
        run: cmake --build build --target package
      - name: Upload artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: build\mxm-*.exe
      - name: Trim ccache and print statistics
        if: always()
        run: |
          /clang64/bin/ccache.exe --cleanup
          echo "[ccache config]"
          /clang64/bin/ccache.exe --show-config
          echo "[ccache stats]"
          /clang64/bin/ccache.exe --show-stats --verbose
